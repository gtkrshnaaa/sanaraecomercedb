# Linux Kernel Parameter Tuning for Dedicated MySQL Database Server
# Location: /etc/sysctl.d/99-mysql-tuning.conf

# Virtual Memory Management
# Lower swappiness to aggressively retain InnoDB buffer pool in physical RAM
vm.swappiness = 1
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
vm.max_map_count = 262144

# File System and Descriptor Limits
fs.file-max = 2097152
fs.aio-max-nr = 1048576

# Network Socket and TCP Optimization
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 16384
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 15
net.ipv4.tcp_keepalive_probes = 5
net.ipv4.ip_local_port_range = 1024 65535
